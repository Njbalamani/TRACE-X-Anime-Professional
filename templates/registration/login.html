{% extends "base.html" %}
{% block title %}Sign in — TRACE-X{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Sign in</h1>
  {% if form.errors %}<div class="msg error">Invalid username or password.</div>{% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <label>Username <input class="input" type="text" name="username" autofocus></label>
    <label>Password <input class="input" type="password" name="password"></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Sign in</button>
  </form>
  <div class="auth-links">New investigator? <a href="{% url 'signup' %}">Create an account</a></div>
  <p class="hint">Demo account: <span class="mono">investigator</span> / <span class="mono">tracex123</span></p>
</div>
{% endblock %}
